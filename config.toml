baseURL = "https://adlermedrado.com.br/"
locale = "en"
title = "Adler Medrado's corner of the web"

[pagination]
  pagerSize = 10

[params]
  categories = ["development", "infosec", "mac"]
  mainSections = ["posts"]
  description = "Adler Medrado (spacexnu) writes about software engineering, cybersecurity, privacy, and digital sovereignty."
  keywords = ["software engineering", "cybersecurity", "privacy", "digital sovereignty", "open source"]
  ogImage = "/images/default-og-image.png"

[outputs]
  home = ["HTML", "RSS", "llms", "Markdown", "ContentAPI"]
  page = ["HTML", "Markdown"]
  section = ["HTML", "RSS", "Markdown"]
  taxonomy = ["HTML", "RSS", "Markdown"]
  term = ["HTML", "RSS", "Markdown"]

[mediaTypes."text/markdown"]
  suffixes = ["md"]

[outputFormats.Markdown]
  mediaType = "text/markdown"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputFormats.ContentAPI]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = true
  notAlternative = true

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true

[permalinks]
  missives = "/missives/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"
  tongue = "languages"

[markup]
    defaultMarkdownHandler = 'goldmark'
    [markup.asciidocExt]
        backend = 'html5'
        extensions = []
        failureLevel = 'fatal'
        noHeaderOrFooter = true
        preserveTOC = false
        safeMode = 'unsafe'
        sectionNumbers = false
        trace = false
        verbose = false
        workingFolderCurrent = false
    [markup.asciidocExt.attributes]
    [markup.goldmark]
        [markup.goldmark.extensions]
            definitionList = true
            footnote = true
            linkify = true
            linkifyProtocol = 'https'
            strikethrough = true
            table = true
            taskList = true
            [markup.goldmark.extensions.typographer]
                apostrophe = '&rsquo;'
                disable = false
                ellipsis = '&hellip;'
                emDash = '&mdash;'
                enDash = '&ndash;'
                leftAngleQuote = '&laquo;'
                leftDoubleQuote = '&ldquo;'
                leftSingleQuote = '&lsquo;'
                rightAngleQuote = '&raquo;'
                rightDoubleQuote = '&rdquo;'
                rightSingleQuote = '&rsquo;'
        [markup.goldmark.parser]
            autoHeadingID = true
            autoHeadingIDType = 'github'
            wrapStandAloneImageWithinParagraph = true
            [markup.goldmark.parser.attribute]
                block = false
                title = true
        [markup.goldmark.renderer]
            hardWraps = false
            unsafe = true
            xhtml = false
    [markup.highlight]
        anchorLineNos = false
        codeFences = true
        guessSyntax = false
        hl_Lines = ''
        hl_inline = false
        lineAnchors = ''
        lineNoStart = 1
        lineNos = false
        lineNumbersInTable = true
        noClasses = true
        noHl = false
        style = 'monokai'
        tabWidth = 4
    [markup.tableOfContents]
        endLevel = 3
        ordered = false
        startLevel = 2
