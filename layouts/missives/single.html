{{ define "main" }}
<article class="content-shell reading-column missive">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
  </header>
  <div class="content-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
  </div>
  <div class="prose">
    {{ .Content }}
  </div>
  {{ if .Params.tags }}
  <div class="post-tags">
    <strong>Tags:</strong>
    {{ range .Params.tags }}
    <a href="/tags/{{ . | urlize }}">{{ . }}</a>{{ if not (eq (index $.Params.tags (sub (len
    $.Params.tags) 1)) .) }}, {{ end }}
    {{ end }}
  </div>
  {{ end }}
</article>
{{ end }}
