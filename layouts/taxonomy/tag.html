{{ define "main" }}
<section class="content-shell tag-posts">
    <div class="reading-column">
      <header class="page-header">
        <h1>{{ .Title }}</h1>
        <p class="page-intro">Posts tagged with <strong>{{ .Title }}</strong>.</p>
      </header>

      <div class="entry-list">
        {{ range .Pages }}
        <article class="entry-list__item">
            <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
            <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "02 Jan 2006" }}</time>
            <div>{{ .Summary }}</div>
        </article>
        {{ end }}
      </div>
    </div>
</section>
{{ end }}
