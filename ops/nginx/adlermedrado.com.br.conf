# Complete virtual host for adlermedrado.com.br.
#
# This file assumes the standard Ubuntu/Debian Nginx layout, where
# /etc/nginx/sites-enabled/* is included from inside the http context.

map $http_accept $agent_wants_markdown {
    default 0;
    ~*text/markdown 1;
}

server {
    listen 443 ssl; # managed by Certbot
    server_name adlermedrado.com.br www.adlermedrado.com.br;

    ssl_certificate /etc/letsencrypt/live/adlermedrado.com.br/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/adlermedrado.com.br/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    root /var/www/adlermedrado.com.br;
    index index.html;

    access_log /var/log/nginx/adlermedrado.access.log;
    error_log /var/log/nginx/adlermedrado.error.log;

    # Agent discovery response headers.
    add_header Link '</.well-known/api-catalog>; rel="api-catalog"; type="application/linkset+json", </.well-known/openapi.json>; rel="service-desc"; type="application/vnd.oai.openapi+json", </agent-api.md>; rel="service-doc"; type="text/markdown", </.well-known/agent-skills/index.json>; rel="describedby"; type="application/json"' always;
    add_header Content-Signal 'ai-train=no, search=yes, ai-input=yes' always;
    add_header Origin-Agent-Cluster '?1' always;
    add_header Vary 'Accept' always;

    # Security response headers.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

    # Content negotiation: browsers receive HTML by default; agents that send
    # Accept: text/markdown receive the Markdown file generated by Hugo.
    error_page 418 = @agent_markdown;

    location / {
        if ($agent_wants_markdown) {
            return 418;
        }

        try_files $uri $uri/ =404;
    }

    location @agent_markdown {
        default_type text/markdown;
        charset utf-8;
        try_files $uri/index.md $uri.md =406;
    }

    # RFC 9727 API catalog. This file has no extension, so its media type must
    # be declared explicitly.
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        try_files $uri =404;
    }

    location = /.well-known/agent-skills/site-content/SKILL.md {
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    location = /agent-api.md {
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    location = /auth.md {
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
    }

    # This protected page has a different CSP. Because defining add_header in a
    # location disables inheritance on Nginx 1.24, its security headers are
    # repeated here intentionally.
    location = /analytics.html {
        auth_basic "Restricted Area";
        auth_basic_user_file /etc/nginx/.htpasswd;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; img-src 'self' data:; font-src 'self' data:;" always;
    }
}

server {
    listen 80;
    server_name adlermedrado.com.br www.adlermedrado.com.br;

    return 301 https://$host$request_uri;
}
